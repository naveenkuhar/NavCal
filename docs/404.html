<!doctype html>

  <script>
    // This page is shown for any missing address, however deep, so it finds its files and links
    // from the site's folder: "/navcal/" on a project's github.io site, "/" elsewhere.
    const siteRoot = location.hostname.endsWith(".github.io") && location.pathname.split("/")[1]
      ? `/${location.pathname.split("/")[1]}/` : "/";
    document.write(`<link rel="icon" href="${siteRoot}icon.svg" type="image/svg+xml">`
      + `<link rel="stylesheet" href="${siteRoot}style.css">`
      + `<script src="${siteRoot}site.js" defer><\/script>`);
    (() => {
      const root = document.documentElement;
      root.classList.add("js");
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch {}
      if (theme === "light" || theme === "dark") root.dataset.theme = theme;
      root.dataset.shownTheme = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>

  <script>
    // Links and pictures, from the site's folder (see the top of the page).
    for (const el of document.querySelectorAll("a[href], img[src]")) {
      const attr = el.tagName === "A" ? "href" : "src";
      const url = el.getAttribute(attr);
      if (!/^(#|\/|[a-z]+:)/i.test(url)) el.setAttribute(attr, siteRoot + url.replace(/^\.\//, ""));
    }
