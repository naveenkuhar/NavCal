[project]
name = "navcal"
version = "0.6.0"
description = "A GNOME calendar with reminders"
requires-python = ">=3.13"
# GTK 4, libadwaita and PyGObject come from the system (e.g. Fedora's
# python3-gobject, gtk4, libadwaita), so the venv needs system site packages.
dependencies = []

[tool.uv]
python-preference = "only-system"

[project.scripts]
navcal = "navcal:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:gi.*"]
